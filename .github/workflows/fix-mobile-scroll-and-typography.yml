name: Fix mobile scroll and typography

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-mobile-scroll-and-typography.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Apply typography and scroll performance patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              "https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap",
              "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap"
            ),
            (
              "--sans:'DM Sans',sans-serif;--serif:'Instrument Serif',serif;",
              "--sans:'Manrope',sans-serif;--serif:'Cormorant Garamond',serif;"
            ),
            (
              "*{box-sizing:border-box;margin:0;padding:0}html{background:var(--bg);scroll-behavior:auto}body{font-family:var(--sans);",
              "*{box-sizing:border-box;margin:0;padding:0}html{background:var(--bg);scroll-behavior:auto;overscroll-behavior-y:none}body{font-family:var(--sans);touch-action:pan-y;"
            ),
            (
              "#cinematic{height:850vh;position:relative}.stage{height:100svh;position:sticky;top:0;overflow:hidden;background:var(--bg)}#frame-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}",
              "#cinematic{height:850vh;position:relative}.stage{height:100svh;position:sticky;top:0;overflow:hidden;background:var(--bg);contain:layout paint style}#frame-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:contents;transform:translateZ(0)}"
            ),
            (
              ".scene h1,.scene h2{font:400 clamp(45px,7.6vw,94px)/.91 var(--serif);letter-spacing:-.035em;text-wrap:balance}",
              ".scene h1,.scene h2{font:500 clamp(45px,7.6vw,94px)/.92 var(--serif);letter-spacing:-.025em;text-wrap:balance}"
            ),
            (
              ".title{font:400 clamp(40px,6vw,74px)/.97 var(--serif);letter-spacing:-.03em;max-width:940px}",
              ".title{font:500 clamp(40px,6vw,74px)/.98 var(--serif);letter-spacing:-.02em;max-width:940px}"
            ),
            (
              ".service b{font:400 29px/1 var(--serif)}",
              ".service b{font:600 30px/1 var(--serif)}"
            ),
            (
              ".panel-title{font:400 30px/1 var(--serif);",
              ".panel-title{font:600 31px/1 var(--serif);"
            ),
            (
              ".footer h2{font:400 clamp(38px,6vw,68px)/.98 var(--serif);",
              ".footer h2{font:500 clamp(38px,6vw,68px)/.98 var(--serif);"
            ),
            (
              "@media(max-width:850px){.brand-copy span{display:none}",
              "@media(max-width:850px){.brand-copy span{display:none}.brand-mark,.circle,.btn,.app-nav{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}.brand-mark,.circle{background:rgba(8,9,13,.76)}.app-nav{background:rgba(10,11,17,.96)}"
            ),
            (
              "gsap.registerPlugin(ScrollTrigger);",
              "gsap.registerPlugin(ScrollTrigger);ScrollTrigger.config({ignoreMobileResize:true,limitCallbacks:true});"
            ),
            (
              "ScrollTrigger.create({trigger:'#cinematic',start:'top top',end:'bottom bottom',scrub:.04,onUpdate:self=>",
              "ScrollTrigger.create({trigger:'#cinematic',start:'top top',end:'bottom bottom',scrub:coarse?false:.04,anticipatePin:1,fastScrollEnd:true,onUpdate:self=>"
            ),
            (
              "if(typeof Lenis!=='undefined'){const lenis=new Lenis({duration:coarse?.72:.78,smoothWheel:true,smoothTouch:false});lenis.on('scroll',ScrollTrigger.update);gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(0)}",
              "if(!coarse&&typeof Lenis!=='undefined'){const lenis=new Lenis({duration:.72,smoothWheel:true,smoothTouch:false,lerp:.12});lenis.on('scroll',ScrollTrigger.update);gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(500,33)}else{window.addEventListener('scroll',ScrollTrigger.update,{passive:true})}"
            )
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Missing expected fragment: {old[:100]}')
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "perf: use native mobile scroll and refine typography"
          git push origin master