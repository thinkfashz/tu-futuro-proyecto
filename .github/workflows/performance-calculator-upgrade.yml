name: Upgrade frame playback and calculator

on:
  push:
    branches:
      - master
    paths:
      - tools/upgrade.py
      - .github/workflows/performance-calculator-upgrade.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply upgrade
        run: python tools/upgrade.py

      - name: Validate
        run: |
          grep -q "progressive, anti-flash" index.html
          grep -q "project-type-selector" index.html
          grep -q "prioritizeAround(fi)" index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: optimize frame playback and upgrade calculator"
          git push origin HEAD:master
