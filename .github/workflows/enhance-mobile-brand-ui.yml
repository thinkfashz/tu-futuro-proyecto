name: Enhance mobile branding and app UI

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/enhance-mobile-brand-ui.yml

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Improve text readability, loader, logo and mobile navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Free icon library.
          fa = '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">'
          if 'font-awesome/6.7.2' not in s:
            s = s.replace('</head>', fa + '\n</head>', 1)

          # Add a centered, real brand treatment and readable glass veil.
          extra_css = r'''
<style id="brand-app-upgrade">
  .scene-inner{
    position:relative;
    isolation:isolate;
    padding:clamp(20px,3.2vw,34px) clamp(18px,3.5vw,38px);
  }
  .scene-inner::before{
    content:"";
    position:absolute;
    z-index:-1;
    inset:-8px -12px;
    border-radius:30px;
    background:linear-gradient(135deg,rgba(7,9,14,.40),rgba(7,9,14,.16));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 70px rgba(0,0,0,.22);
    -webkit-backdrop-filter:blur(10px) saturate(112%);
    backdrop-filter:blur(10px) saturate(112%);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%);
  }
  .scene h1,.scene h2{font-weight:500;letter-spacing:-.025em;text-shadow:0 4px 20px rgba(0,0,0,.9),0 14px 55px rgba(0,0,0,.72)}
  .scene p{font-weight:500;color:rgba(255,255,255,.9);text-shadow:0 3px 18px rgba(0,0,0,.92)}
  .topbar{justify-content:center;padding-top:max(14px,env(safe-area-inset-top));pointer-events:none}
  .brand{pointer-events:auto;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;padding:10px 16px 10px 10px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(8,10,16,.58);box-shadow:0 14px 40px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(18px) saturate(125%);backdrop-filter:blur(18px) saturate(125%)}
  .brand-mark{width:44px;height:44px;border-radius:50%;font-size:0;background:radial-gradient(circle at 35% 30%,#f2ddb4,#c79a50 54%,#6d4921);border:1px solid rgba(255,255,255,.38);box-shadow:inset 0 0 0 3px rgba(8,9,13,.72),0 6px 20px rgba(0,0,0,.28)}
  .brand-mark::before{content:"TFP";font:700 10px/1 var(--sans);letter-spacing:.08em;color:#17120a}
  .brand-copy{text-align:left;line-height:1.08}
  .brand-copy b{font-size:13px;letter-spacing:-.01em}
  .brand-copy span{font-size:8px;letter-spacing:.17em;margin-top:4px}
  .social-top{position:absolute;right:18px;pointer-events:auto}
  #loader{background:radial-gradient(circle at 50% 38%,#1b2030 0,#0c0f17 52%,#06070a 100%)}
  .loader{display:grid;justify-items:center}
  .loader-symbol{width:94px;height:94px;border-radius:50%;font-size:0;position:relative;background:radial-gradient(circle at 35% 28%,#f4dfb8,#c9974f 52%,#67441f);border:1px solid rgba(255,255,255,.34);box-shadow:inset 0 0 0 6px rgba(8,9,13,.78),0 20px 70px rgba(0,0,0,.45);animation:loaderFloat 2.4s ease-in-out infinite}
  .loader-symbol::before{content:"TFP";display:grid;place-items:center;position:absolute;inset:10px;border:1px solid rgba(20,15,8,.34);border-radius:50%;font:700 17px/1 var(--sans);letter-spacing:.14em;color:#17120a}
  .loader h1{font-size:clamp(35px,8vw,48px);font-weight:500;letter-spacing:-.02em;margin-top:2px}
  .loader p{max-width:31ch;font-size:13px}
  .loader-line{width:min(330px,78vw);height:3px;border-radius:999px;margin-top:28px}
  .loader-line i{border-radius:999px;box-shadow:0 0 20px rgba(239,212,160,.6)}
  @keyframes loaderFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.025)}}
  .app-nav{grid-template-columns:repeat(4,1fr)!important;height:82px!important;left:10px!important;right:10px!important;bottom:calc(9px + var(--safe))!important;padding:8px!important;border-radius:27px!important;background:rgba(10,12,18,.92)!important;border:1px solid rgba(255,255,255,.16)!important;box-shadow:0 22px 65px rgba(0,0,0,.56),inset 0 1px 0 rgba(255,255,255,.08)!important;-webkit-backdrop-filter:blur(22px) saturate(135%);backdrop-filter:blur(22px) saturate(135%)}
  .app-nav a{position:relative;border-radius:19px;gap:6px!important;transition:transform .22s ease,color .22s ease,background .22s ease}
  .app-nav a:active{transform:scale(.92)}
  .app-nav a.active{background:linear-gradient(145deg,rgba(210,173,107,.24),rgba(210,173,107,.08));box-shadow:inset 0 0 0 1px rgba(239,212,160,.18)}
  .app-nav i{font-size:21px;line-height:1}
  .app-nav small{font-size:9px;font-weight:700;letter-spacing:.04em}
  @media(max-width:850px){
    .scene{padding-top:112px;padding-bottom:126px}
    .scene-inner{width:min(94vw,650px);padding:24px 20px}
    .scene-inner::before{inset:-5px -6px;border-radius:25px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%)}
    .scene.left,.scene.right,.scene.center{text-align:center;justify-content:center}
    .scene p,.scene.right p,.scene.center p{margin-left:auto;margin-right:auto}
    .scene-actions,.scene.right .scene-actions,.scene.center .scene-actions{justify-content:center}
    .topbar{padding-left:12px;padding-right:12px}
    .brand{max-width:calc(100vw - 126px);padding-right:13px}
    .brand-copy b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand-copy span{display:block!important;white-space:nowrap}
    .social-top{right:12px}
    .social-top .circle{width:43px;height:43px}
  }
  @media(max-width:520px){
    .brand{grid-template-columns:40px 1fr;gap:9px;padding:7px 11px 7px 7px;max-width:calc(100vw - 110px)}
    .brand-mark{width:40px;height:40px}
    .brand-copy b{font-size:11px}
    .brand-copy span{font-size:7px}
    .social-top .circle{display:none}
    .social-top .circle:last-child{display:grid}
    .scene-inner{padding:22px 16px}
    .scene h1,.scene h2{font-size:clamp(39px,11.8vw,54px);line-height:.94}
  }
</style>'''
          if 'brand-app-upgrade' not in s:
            s = s.replace('</head>', extra_css + '\n</head>', 1)

          # Replace mobile nav glyphs with Font Awesome Free icons.
          nav = '''<nav class="app-nav" aria-label="Navegación principal">
<a href="#cinematic" class="active"><i class="fa-solid fa-house" aria-hidden="true"></i><small>Inicio</small></a>
<a href="#servicios"><i class="fa-solid fa-layer-group" aria-hidden="true"></i><small>Servicios</small></a>
<a href="#cotizador"><i class="fa-solid fa-calculator" aria-hidden="true"></i><small>Cotizar</small></a>
<a href="https://wa.me/56920688075" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i><small>WhatsApp</small></a>
</nav>'''
          s = re.sub(r'<nav class="app-nav">.*?</nav>', nav, s, count=1, flags=re.S)

          # Improve visible marketing copy without changing structure.
          replacements = {
            'Construimos espacios para tu <em>próxima etapa</em>': 'Diseñamos el lugar donde comienza tu <em>próxima historia</em>',
            'Transformamos una necesidad real en un proyecto claro, habitable y pensado para acompañar tu forma de vivir.': 'Convertimos tus ideas en espacios bien resueltos, confortables y preparados para crecer contigo.',
            'Una casa diseñada alrededor de tu <em>familia</em>': 'Una vivienda pensada desde la forma en que tu <em>familia vive</em>',
            'Organizamos distribución, estructura, instalaciones y terminaciones desde el inicio para construir con mayor claridad.': 'Planificamos distribución, estructura, instalaciones y terminaciones como un solo proyecto, desde el primer trazo.',
            'Más espacio sin perder la esencia de tu <em>hogar</em>': 'Haz crecer tu casa sin perder la esencia de tu <em>hogar</em>',
            'Integramos nuevos dormitorios, cocinas o segundos pisos a la vivienda existente.': 'Integramos dormitorios, cocinas, terrazas o segundos pisos para que lo nuevo se sienta parte de lo que ya existe.',
            'El exterior convertido en un lugar para <em>compartir</em>': 'El exterior convertido en tu lugar favorito para <em>compartir</em>',
            'Creamos espacios protegidos, funcionales y preparados para disfrutarse durante todo el año.': 'Construimos quinchos y terrazas cómodos, protegidos y diseñados para disfrutarse en cualquier temporada.',
            'Comienza con una estimación y termina con una <em>conversación</em>': 'Tu proyecto puede comenzar hoy con una <em>estimación clara</em>',
            'Configura el servicio, superficie y terminaciones. El formulario prepara automáticamente todos los datos para WhatsApp.': 'Selecciona servicio, superficie y nivel de terminación. Nosotros preparamos automáticamente tu solicitud para WhatsApp.'
          }
          for old, new in replacements.items():
            s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit visual upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: improve mobile branding loader and app navigation"
          git push origin master
